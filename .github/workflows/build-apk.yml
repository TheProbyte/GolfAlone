name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and UI tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GolfAlone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GolfAlone-apk
          path: GolfAlone.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Golf Alone (latest build)
          body: |
            Latest build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **GolfAlone.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser if asked).
          prerelease: true
          make_latest: true
          files: GolfAlone.apk
